<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Klien - Dhi Memories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#3b82f6' } } } } }
    </script>
    <style>
        .photo-card { transition: all 0.2s ease; border: 3px solid transparent; cursor: pointer; }
        .photo-card:hover { border-color: #475569; transform: translateY(-2px); }
        .photo-card.selected { border-color: #10b981; transform: scale(0.96); }
        .selected-badge { display: none; }
        .photo-card.selected .selected-badge { display: flex; }

        /* Skeleton loading */
        .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Modal */
        #cartModal { transition: opacity 0.3s ease; }
        #cartModal.hidden { opacity: 0; pointer-events: none; }
        #cartContent { transition: transform 0.3s ease; }
        #cartModal.hidden #cartContent { transform: translateY(100%); }
        #cartModal:not(.hidden) #cartContent { transform: translateY(0); }

        /* Fade in */
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-300 font-sans min-h-screen selection:bg-brand-primary selection:text-white">

    <!-- PIN SECTION -->
    <div id="pinSection" class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
        <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 text-center fade-in">
            <div class="w-16 h-16 bg-brand-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Galeri <span class="text-brand-primary">Privat</span></h2>
            <p class="text-slate-400 mb-8 text-sm">Masukkan PIN dari fotografer Anda</p>
            <form id="pinForm" class="space-y-5">
                <input type="text" id="clientPin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-white text-center text-3xl font-mono tracking-[0.5em] focus:ring-2 focus:ring-brand-primary focus:outline-none transition-all" placeholder="------" maxlength="20" required autocomplete="off">
                <p id="pinError" class="text-red-400 text-sm hidden"></p>
                <button type="submit" id="submitBtn" class="w-full bg-brand-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-500/25">Buka Galeri</button>
            </form>
        </div>
    </div>

    <!-- GALLERY SECTION -->
    <div id="gallerySection" style="display: none;" class="pb-40">
        <!-- Header sticky -->
        <div class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="overflow-hidden">
                    <h1 class="text-base md:text-lg font-bold text-white truncate" id="projectNameUI">Memuat...</h1>
                    <p class="text-xs text-slate-500" id="photoCountUI">Memuat foto...</p>
                </div>
                <span id="counterUI" class="px-4 py-2 bg-slate-800 border border-slate-700 text-white rounded-lg font-bold text-sm transition-all duration-300 shrink-0 ml-3">0 / 0</span>
            </div>
        </div>

        <!-- Info bar -->
        <div class="max-w-7xl mx-auto px-4 mt-4 mb-6">
            <div class="bg-brand-primary/10 border border-brand-primary/20 text-brand-primary text-center py-3 px-4 rounded-xl text-sm font-medium" id="instructionUI">
                Menghubungkan ke server...
            </div>
        </div>

        <!-- Photo grid -->
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4" id="photoGrid"></div>

        <!-- Bottom bar -->
        <div class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 z-40">
            <div class="max-w-7xl mx-auto flex justify-center gap-3">
                <button onclick="openCart()" class="bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 font-bold py-3 px-5 rounded-xl transition-all flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Review (<span id="cartCount">0</span>)
                </button>
                <button onclick="submitSelection()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-emerald-500/20 transition-all hover:scale-105 flex items-center gap-2 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    Kirim ke WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- CART MODAL -->
    <div id="cartModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm">
        <div id="cartContent" class="bg-slate-900 w-full max-w-4xl h-[80vh] rounded-t-3xl border-t border-slate-700 shadow-2xl flex flex-col">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-lg font-bold text-white">Foto Pilihan Anda</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Review sebelum dikirim ke WhatsApp</p>
                </div>
                <button onclick="closeCart()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-300 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 bg-slate-950">
                <div id="cartList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </div>
        </div>
    </div>

<script>
    // ✅ FIX: URL relatif — otomatis benar di localhost maupun Vercel
    const API_URL = '/api';
    let activeProject = null;
    let realPhotos = [];
    let selectedPhotos = [];

    // SUBMIT PIN
    document.getElementById('pinForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const pin = document.getElementById('clientPin').value.trim();
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('pinError');

        btn.textContent = 'Memeriksa...'; btn.disabled = true;
        err.classList.add('hidden');

        try {
            const res = await fetch(`${API_URL}/projects/${pin}/photos`);
            const data = await res.json();

            if (res.ok) {
                activeProject = data.project;
                // Sort foto berdasarkan nama
                realPhotos = data.photos.sort((a, b) => a.name.localeCompare(b.name));

                document.getElementById('pinSection').style.display = 'none';
                document.getElementById('gallerySection').style.display = 'block';
                document.getElementById('projectNameUI').textContent = activeProject.name;
                document.getElementById('photoCountUI').textContent = `${realPhotos.length} foto tersedia`;
                document.getElementById('counterUI').textContent = `0 / ${activeProject.maxPhotos}`;
                document.getElementById('instructionUI').textContent =
                    `Ditemukan ${realPhotos.length} foto. Pilih maksimal ${activeProject.maxPhotos} foto terbaik Anda.`;

                renderPhotos();
            } else {
                err.textContent = data.error || 'PIN tidak valid.';
                err.classList.remove('hidden');
                btn.textContent = 'Buka Galeri'; btn.disabled = false;
            }
        } catch {
            err.textContent = 'Gagal terhubung ke server. Coba lagi.';
            err.classList.remove('hidden');
            btn.textContent = 'Buka Galeri'; btn.disabled = false;
        }
    });

    // RENDER FOTO
    function renderPhotos() {
        const grid = document.getElementById('photoGrid');

        if (realPhotos.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500">
                <svg class="w-12 h-12 mx-auto mb-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <p>Tidak ada foto ditemukan di folder ini.</p>
            </div>`;
            return;
        }

        grid.innerHTML = realPhotos.map(photo => {
            const thumb = photo.thumbnailLink
                ? photo.thumbnailLink.replace(/=s\d+/, '=s800')
                : 'https://placehold.co/800x533/1e293b/475569?text=No+Image';
            return `
                <div class="relative photo-card rounded-xl overflow-hidden aspect-[3/2] bg-slate-800 shadow-md"
                     id="photo-${photo.id}"
                     onclick="togglePhoto('${photo.id}', '${escapeAttr(photo.name)}', '${escapeAttr(thumb)}')">
                    <img src="${thumb}"
                         class="w-full h-full object-cover"
                         loading="lazy"
                         onerror="this.src='https://placehold.co/800x533/1e293b/475569?text=Error'">
                    <div class="selected-badge absolute top-2.5 right-2.5 bg-emerald-500 text-white w-7 h-7 rounded-full items-center justify-center font-bold shadow-lg z-10 ring-4 ring-emerald-500/30 text-sm">✓</div>
                    <div class="absolute bottom-0 left-0 w-full p-2.5 bg-gradient-to-t from-slate-900/90 to-transparent">
                        <p class="text-slate-300 text-xs font-mono truncate">${photo.name}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeAttr(str) {
        return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // TOGGLE PILIH FOTO
    function togglePhoto(id, fileName, imgUrl) {
        const el = document.getElementById(`photo-${id}`);
        const index = selectedPhotos.findIndex(p => p.id === id);

        if (index > -1) {
            selectedPhotos.splice(index, 1);
            el.classList.remove('selected');
        } else {
            if (selectedPhotos.length >= activeProject.maxPhotos) {
                alert(`Batas maksimal ${activeProject.maxPhotos} foto tercapai!`);
                return;
            }
            selectedPhotos.push({ id, fileName, imgUrl });
            el.classList.add('selected');
        }
        updateCounter();
        renderCartList();
    }

    function updateCounter() {
        const el = document.getElementById('counterUI');
        const cartCount = document.getElementById('cartCount');
        el.textContent = `${selectedPhotos.length} / ${activeProject.maxPhotos}`;
        cartCount.textContent = selectedPhotos.length;
        el.className = selectedPhotos.length === activeProject.maxPhotos
            ? 'px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold text-sm transition-all duration-300 shrink-0 ml-3'
            : 'px-4 py-2 bg-slate-800 border border-slate-700 text-white rounded-lg font-bold text-sm transition-all duration-300 shrink-0 ml-3';
    }

    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); }

    // RENDER CART
    function renderCartList() {
        const list = document.getElementById('cartList');
        if (selectedPhotos.length === 0) {
            list.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">Belum ada foto yang dipilih.</div>`;
            return;
        }
        list.innerHTML = selectedPhotos.map(p => `
            <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <img src="${p.imgUrl}" class="w-20 h-14 object-cover rounded-lg shrink-0" loading="lazy">
                <div class="flex-1 min-w-0">
                    <p class="text-white font-mono text-xs truncate">${p.fileName}</p>
                </div>
                <button onclick="togglePhoto('${p.id}', '${escapeAttr(p.fileName)}', '${escapeAttr(p.imgUrl)}')"
                    class="text-red-400 hover:text-red-500 px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 rounded-lg text-xs font-bold transition-colors shrink-0">
                    Hapus
                </button>
            </div>
        `).join('');
    }

    // KIRIM KE WHATSAPP
    function submitSelection() {
        if (selectedPhotos.length === 0) {
            alert('Anda belum memilih foto.');
            return;
        }

        const sorted = [...selectedPhotos].sort((a, b) => a.fileName.localeCompare(b.fileName));
        const fileNames = sorted.map(p => `- ${p.fileName}`).join('\n');
        const message = `Halo *Dhi Memories*,\n\nSaya dari proyek: *${activeProject.name}*\nBerikut adalah *${sorted.length} foto* pilihan saya:\n\n${fileNames}\n\nTerima kasih! 🙏`;

        // ✅ FIX: Nomor WA diambil dari database, bukan hardcoded
        const waNumber = activeProject.waNumber || '62881027153295';
        window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`, '_blank');
    }
</script>
</body>
</html>

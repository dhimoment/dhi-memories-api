<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhi Memories - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { primary: '#3b82f6', dark: '#0f172a' } } } }
        }
    </script>
</head>
<body class="bg-[#0f172a] text-slate-300 font-sans min-h-screen">

    <div id="loginSection" class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-primary/10 blur-[100px] rounded-full pointer-events-none"></div>
        <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 text-center">
            <h2 class="text-2xl font-bold text-white mb-6">Admin <span class="text-brand-primary">Login</span></h2>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-brand-primary focus:outline-none" placeholder="Username (admin)" required>
                <input type="password" id="password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-brand-primary focus:outline-none" placeholder="Password (admin)" required>
                <button type="submit" class="w-full bg-brand-primary hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg mt-4">Masuk Markas</button>
            </form>
        </div>
    </div>

    <div id="dashboardSection" style="display: none;" class="p-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-8">
            <div>
                <h1 class="text-2xl font-bold text-white">Dhi Memories <span class="text-brand-primary">Admin</span></h1>
                <p class="text-sm text-slate-400">Pusat kendali database persisten.</p>
            </div>
            <button onclick="logout()" class="px-4 py-2 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition-colors text-sm font-semibold">Keluar Sistem</button>
        </div>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl h-fit">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-slate-800 pb-4">Buat Proyek Baru</h2>
                <form id="projectForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Klien / Acara</label>
                        <input type="text" id="pName" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:ring-1 focus:ring-brand-primary focus:outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Link Google Drive</label>
                        <input type="url" id="pLink" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:ring-1 focus:ring-brand-primary focus:outline-none" placeholder="https://drive.google.com/..." required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">PIN Akses Klien</label>
                        <input type="text" id="pPin" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:ring-1 focus:ring-brand-primary focus:outline-none" placeholder="misal: 123456" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Maksimal Foto</label>
                        <input type="number" id="pMax" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:ring-1 focus:ring-brand-primary focus:outline-none" value="20" required>
                    </div>
                    <button type="submit" class="w-full bg-brand-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-all mt-4">Simpan Proyek</button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-slate-800 pb-4">Proyek Aktif (Database)</h2>
                <div id="projectList" class="space-y-3"></div>
            </div>
        </div>
    </div>

<script>
const API_URL = 'https://dhi-memories-api.vercel.app/api';
    let projects = [];

    // 1. Logika Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Mencegah browser melakukan refresh paksa
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                fetchProjects(); 
            } else {
                alert("Username atau Password Admin salah!");
            }
        } catch (error) {
            alert("Gagal terhubung. Pastikan terminal 'nodemon server.js' sedang menyala!");
        }
    });

    function logout() {
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'flex';
        document.getElementById('loginForm').reset();
    }

    // 2. Mengambil Data
    async function fetchProjects() {
        try {
            const response = await fetch(`${API_URL}/projects`);
            projects = await response.json();
            renderProjectList();
        } catch (error) {
            console.error(error);
        }
    }

    // 3. Menyimpan Data
    document.getElementById('projectForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            name: document.getElementById('pName').value,
            driveLink: document.getElementById('pLink').value,
            pin: document.getElementById('pPin').value,
            maxPhotos: document.getElementById('pMax').value
        };

        try {
            const response = await fetch(`${API_URL}/projects`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('projectForm').reset();
                fetchProjects();
            } else {
                const err = await response.json();
                alert(`Gagal: ${err.error}`);
            }
        } catch (error) {
            alert("Kesalahan jaringan saat menyimpan.");
        }
    });

    // 4. Merender Daftar
    function renderProjectList() {
        const list = document.getElementById('projectList');
        if (projects.length === 0) {
            list.innerHTML = `<div class="text-center py-12 bg-slate-950/50 rounded-xl border border-dashed border-slate-800"><p class="text-slate-500">Belum ada data di database.</p></div>`;
            return;
        }
        
        list.innerHTML = projects.map(p => `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-950 border border-slate-800 rounded-xl hover:border-slate-700 transition-colors">
                <div class="w-full sm:w-3/4 overflow-hidden">
                    <h3 class="font-bold text-white text-lg">${p.name}</h3>
                    <p class="text-xs text-brand-primary truncate mt-1 hover:underline"><a href="${p.driveLink}" target="_blank">${p.driveLink}</a></p>
                    <div class="flex gap-4 mt-2 text-xs text-slate-400">
                        <p>PIN: <span class="text-emerald-400 font-mono">${p.pin}</span></p>
                        <p>Kuota: ${p.maxPhotos} foto</p>
                    </div>
                </div>
                <button class="mt-4 sm:mt-0 px-4 py-2 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition-colors text-sm font-semibold whitespace-nowrap" onclick="deleteProject('${p.id}')">Hapus</button>
            </div>
        `).join('');
    }

    // 5. Menghapus Data
    async function deleteProject(id) {
        if(confirm("Yakin hapus dari database permanen?")) {
            try {
                const response = await fetch(`${API_URL}/projects/${id}`, { method: 'DELETE' });
                if (response.ok) fetchProjects();
            } catch (error) {
                alert("Gagal menghapus proyek.");
            }
        }
    }
</script>
</body>
</html>
